<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>

    <style>

        @font-face {
            font-family: 'Evantic';
            src: url('fonte/Evantic-Italic.ttf') format('truetype'), 
            url('fonte/Evantic-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /*
            @font-face {
                font-family: 'Evantic';
                src: url('fonte/Evantic-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            }
            */


              /* 
            Tipos de format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typegraphy)
            - svg
            */
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Evantic', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }

    </style>

</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugiat corrupti itaque rerum. Nostrum praesentium rerum ipsum ex! Dignissimos facere nesciunt esse. Hic ea magni cum temporibus. Sint est consequatur perferendis!</p>

</body>
</html>
