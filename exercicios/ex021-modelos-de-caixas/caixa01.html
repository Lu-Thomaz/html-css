<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixas</title>

    <style>
        h1 { /* Se quiser passar de box-level para inline-level inserir (display: inline;) e excluir a altura e largura */
            background-color: lightgray;
            height: 300px;
            width: 300px;

            /*
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;
            */

            border: 10px solid lightseagreen;

            /*
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            */
                                              
            /*
            padding: 10px 20px:
            (nformando 1 valor, todos os 4 lados ficam iguais)
            (se 2 valores diferentes, o de cima e o de baixo ficam com o primeiro valor (10px), e o segundo valor (20px) para a dir e esq.)*/

            padding: 10px;
            
            /*
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 40px;
            margin-left: 10px;
            
            margin: 20px 20px 40px 20px;

            Para centralizar a caixa horizontalmente, coloque: (margin: auto;) */

            margin: 20px auto 40px auto;
            

            /*
            outline-width: 10px;
            outline-style: dashed;
            outline-color: salmon;
            */

            outline: 10px dashed salmon;
        }

        
        a { /* Para mudar de inline-level para box-level: (display: block;) ou colocar (display: inline-block;) vai continuar inline mas com característcas de bloco, com altura e largura. 

            border-width: 10px;
            border-style: solid;
            border-color: red;
            */
            border: 10px solid red;

            /*
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            */
            padding: 10px;
        }
    </style>

</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
